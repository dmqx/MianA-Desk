# MianA Desk v1.2 release workflow
name: Build Windows package

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !github.event.forced }}
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt 6.11.2
        shell: pwsh
        run: |
          $base = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64/qt.qt6.6112.win64_msvc2022_64"
          $prefix = "6.11.2-0-202608131017"
          $archives = @(
            "qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
            "qtdeclarative-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
            "qttools-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
            "qttranslations-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
          )
          $qtRoot = "C:\Qt\6.11.2\msvc2022_64"
          New-Item -ItemType Directory -Force $qtRoot | Out-Null
          foreach ($archive in $archives) {
            $file = Join-Path $env:RUNNER_TEMP $archive
            Invoke-WebRequest "$base/$prefix$archive" -OutFile $file
            7z x $file "-o$qtRoot" -y
          }
          Set-Content -Path "C:\Qt\6.11.2\msvc2022_64\bin\qt.conf" -Value "[Paths]`nPrefix=.."
          "C:\Qt\6.11.2\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure application
        run: cmake --preset windows-msvc-release

      - name: Build application
        run: cmake --build --preset windows-msvc-release

      - name: Deploy application
        run: cmake --install .build --config Release --prefix dist/package

      - name: Configure single-file packager
        run: >-
          cmake -S packaging -B .package-build
          -G "Visual Studio 17 2022" -A x64
          -DMIANA_DIST_DIR="${{ github.workspace }}/dist/package"

      - name: Build single-file package
        run: cmake --build .package-build --config Release --target MianADeskPackage --parallel

      - name: Stage artifact
        shell: powershell
        run: Copy-Item ".package-build/Release/MianA Desk.exe" "dist/MianA-Desk-${{ github.ref_name }}.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MianA-Desk-${{ github.ref_name }}
          path: dist/MianA-Desk-${{ github.ref_name }}.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          1. 桌面端整体升级并重构为 C++23
          2. UI 与运行框架升级至 Qt 6.11.2
          3. 修复浮窗关闭后从托盘恢复时窗口模式丢失的问题
          "@
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release edit "${{ github.ref_name }}" --title "MianA Desk ${{ github.ref_name }}" --notes $notes
            gh release upload "${{ github.ref_name }}" "dist/MianA-Desk-${{ github.ref_name }}.exe" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "dist/MianA-Desk-${{ github.ref_name }}.exe" --title "MianA Desk ${{ github.ref_name }}" --notes $notes
          }